<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App - Cek Cuaca</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-800 min-h-screen flex items-center justify-center p-5">
  <div class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl w-full max-w-md p-6 text-white">
    <h1 class="text-3xl font-bold text-center mb-6"><i class="bi bi-cloud-sun"></i> Cek Cuaca</h1>
    
    <div class="flex gap-2 mb-6">
      <input type="text" id="cityInput" placeholder="Masukkan nama kota..." class="flex-1 bg-white/20 border border-white/30 rounded-xl px-4 py-3 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-400">
      <button id="searchBtn" class="bg-blue-500 hover:bg-blue-600 px-5 rounded-xl transition"><i class="bi bi-search text-xl"></i></button>
    </div>
    
    <div id="weatherResult" class="text-center hidden">
      <div class="mb-4">
        <i id="weatherIcon" class="bi bi-cloud-sun text-7xl"></i>
      </div>
      <h2 id="cityName" class="text-2xl font-bold"></h2>
      <p id="temperature" class="text-5xl font-bold my-3"></p>
      <p id="description" class="text-lg capitalize"></p>
      <div class="flex justify-around mt-6 pt-4 border-t border-white/30">
        <div><i class="bi bi-droplet text-xl"></i><p id="humidity" class="text-sm">--%</p></div>
        <div><i class="bi bi-wind text-xl"></i><p id="windSpeed" class="text-sm">-- km/h</p></div>
      </div>
    </div>
    
    <div id="errorMsg" class="text-center text-red-300 hidden">Kota tidak ditemukan. Silakan coba lagi.</div>
    
    <div class="text-center text-white/50 text-sm mt-6">Demo menggunakan API publik (simulasi)</div>
  </div>

  <script>
    // Demo mode: Karena API key perlu registrasi, ini simulasi dengan data statis + fetch ke API dummy
    // Untuk production: daftar di https://openweathermap.org/api dan ganti API_KEY
    
    const API_KEY = 'YOUR_API_KEY'; // Ganti dengan API key Anda dari openweathermap.org
    
    async function fetchWeather(city) {
      if (API_KEY === 'YOUR_API_KEY') {
        // Mode demo: simulasi data cuaca
        simulateWeather(city);
        return;
      }
      
      try {
        const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${API_KEY}&lang=id`);
        if (!response.ok) throw new Error('Kota tidak ditemukan');
        const data = await response.json();
        displayWeather(data);
      } catch (error) {
        showError();
      }
    }
    
    function simulateWeather(city) {
      // Data simulasi untuk demo
      const weatherData = {
        name: city.charAt(0).toUpperCase() + city.slice(1),
        main: { temp: Math.floor(Math.random() * 30) + 15, humidity: Math.floor(Math.random() * 60) + 30 },
        weather: [{ description: ['cerah', 'berawan', 'hujan ringan', 'berawan tebal'][Math.floor(Math.random() * 4)], icon: '01d' }],
        wind: { speed: Math.floor(Math.random() * 15) + 1 }
      };
      displayWeather(weatherData);
    }
    
    function displayWeather(data) {
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('weatherResult').classList.remove('hidden');
      
      document.getElementById('cityName').innerText = data.name;
      document.getElementById('temperature').innerHTML = `${Math.round(data.main.temp)}°C`;
      document.getElementById('description').innerText = data.weather[0].description;
      document.getElementById('humidity').innerHTML = `${data.main.humidity}%`;
      document.getElementById('windSpeed').innerHTML = `${data.wind.speed} km/h`;
      
      // Set icon based on weather condition
      const iconMap = { clear: 'bi-brightness-high', clouds: 'bi-cloud', rain: 'bi-cloud-rain', snow: 'bi-snow', thunderstorm: 'bi-cloud-lightning', default: 'bi-cloud-sun' };
      let iconClass = iconMap.default;
      if (data.weather[0].description.includes('cerah')) iconClass = iconMap.clear;
      else if (data.weather[0].description.includes('berawan')) iconClass = iconMap.clouds;
      else if (data.weather[0].description.includes('hujan')) iconClass = iconMap.rain;
      document.getElementById('weatherIcon').className = `bi ${iconClass} text-7xl`;
    }
    
    function showError() {
      document.getElementById('weatherResult').classList.add('hidden');
      document.getElementById('errorMsg').classList.remove('hidden');
    }
    
    function searchWeather() {
      const city = document.getElementById('cityInput').value.trim();
      if (city) fetchWeather(city);
    }
    
    document.getElementById('searchBtn').addEventListener('click', searchWeather);
    document.getElementById('cityInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchWeather(); });
    
    // Demo default
    setTimeout(() => fetchWeather('Jakarta'), 500);
  </script>
</body>
</html>
